<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio II</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="card">
    <h1>Ejercicio 2</h1>

    <form method="POST">
      <label>Nombre 1:</label>
      <input type="text" name="nombre1" required>

      <label>Nombre 2:</label>
      <input type="text" name="nombre2" required>

      <label>Nombre 3:</label>
      <input type="text" name="nombre3" required>

      <button class="btn-submit" type="submit">Enviar</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    {% if resultado %}
      <p>Nombre con más caracteres: <strong>{{ resultado.mayor }}</strong></p>
      <p>Cantidad de caracteres: <strong>{{ resultado.largo }}</strong></p>
    {% endif %}

    <a class="back" href="/">Volver al menú</a>
  </div>
</body>
</html>
